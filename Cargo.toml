[workspace]
resolver = "3"
members = ["crates/syntax", "crates/format", "crates/index", "crates/analysis", "crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
