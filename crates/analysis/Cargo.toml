[package]
name = "php-analysis"
description = "Syntax-tree and index queries for the PHP language server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lsc-text.workspace = true
php-format = { version = "0.5.0", path = "../format" }
php-index = { version = "0.5.0", path = "../index" }
php-syntax = { version = "0.5.0", path = "../syntax" }
rayon = "1.12.0"
sql-embed.workspace = true

[dev-dependencies]
lsc-text = { workspace = true, features = ["testing"] }
php-index = { version = "0.5.0", path = "../index", features = ["testing"] }
expect-test = "1.5.1"
serde_json = "1.0.151"
criterion = "0.7.0"

[[bench]]
name = "completion"
harness = false

[[bench]]
name = "features"
harness = false
