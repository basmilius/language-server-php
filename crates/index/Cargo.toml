[package]
name = "php-index"
description = "Declarations, types and name resolution for the PHP language server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = "1.1.10"
php-syntax = { version = "0.3.0", path = "../syntax" }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
ureq = "3.4.2"
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3", "const_xxh3"] }

[features]
# Fixtures for the tests of the crates built on this one.
testing = []

[dev-dependencies]
expect-test = "1.5.1"
tempfile = "3.27.0"
criterion = "0.7.0"

[[bench]]
name = "index"
harness = false
